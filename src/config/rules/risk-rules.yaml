# 위험 점검 규칙 (PART 3)
# - 규칙의 "문구"와 "설정"만 둔다. 판정 로직은 src/features/risk-check/*.js 에 있다.
# - 상태(STOP / CHECK / NO_FLAG / UNVERIFIABLE)마다 explanation, action을 적는다.
# - {owner}, {landlord}, {accountHolder} 자리에는 PART 4가 만든 역할 가명(예: [Owner_A])이 들어간다.
#   실제 이름은 절대 쓰지 않는다. 이 문구는 AI 프롬프트에 그대로 들어가기 때문이다.
# - evidence: 화면에만 보여 주는 근거 칸의 제목 (프롬프트에는 넣지 않는다).

# - {maxClaim}, {deposit}, {months}: 금액·기간. 개인정보가 아니라서 설명에 넣어도 된다.
# - results 키는 상태(STOP 등) 또는 "상태.변형"(예: CHECK.cancel_unknown)이다.
#   같은 상태라도 이유가 다를 때(말소 여부 모름, 금액 못 읽음 등) 문구를 따로 쓰려고 쓴다.
# - params: 판정 로직이 읽는 설정값 (예: 최근 소유권 이전 기준 개월 수)

rules:
  OWNER_MISMATCH:
    title: Owner and landlord check
    evidence:
      left: Registry owner
      right: Contract landlord
    results:
      STOP:
        explanation: >-
          {owner} is the registered owner, but {landlord} is signing as the landlord.
          If the person signing is not the registered owner, they may have no right to
          rent out the home, and your deposit may not be protected.
        action: >-
          Ask to see the landlord's ID and compare the name and birth date with the
          owner on the registry.
      CHECK.co_owner:
        explanation: >-
          This home has more than one registered owner ({owner}), but only {landlord} signs
          as the landlord. The other owners may also need to agree to the lease.
        action: >-
          Ask for written consent from the other owners, or ask all owners to sign the contract.
      NO_FLAG:
        explanation: >-
          The registered owner and the landlord appear to be the same person ({landlord}).
          This is based only on the documents you uploaded.
        action: No action needed for this check. Still check the landlord's ID when you meet.
      CHECK.entity:
        explanation: >-
          The registered owner and the landlord look like different parties, but a company
          or a trust seems to be involved. In a trust, the registered owner is usually the
          trust company (the trustee), and a company has no birth date to compare, so a
          different name does not always mean a problem.
        action: >-
          Check who has the right to lease the home: the company registration number, or the
          trust register (신탁원부) if there is a trust. Ask for the trustee's written consent
          to the lease.
      UNVERIFIABLE:
        explanation: >-
          We could not tell whether the registered owner and the landlord are the same
          person, because a name or birth date could not be read or confirmed.
        action: >-
          Ask to see the landlord's ID and compare it with the owner on the registry yourself.
      UNVERIFIABLE.entity:
        explanation: >-
          We did not compare the registered owner and the landlord, because a company or a
          trust seems to be involved. Names and birth dates cannot be used to compare
          companies or trustees, and this is not a sign that the lease is safe.
        action: >-
          Check who has the right to lease the home: the company registration number, or the
          trust register (신탁원부) if there is a trust. Ask for the trustee's written consent
          to the lease.
      UNVERIFIABLE.unreliable_name:
        explanation: >-
          The registered owner and the landlord look like different people, but we did not
          treat this as a mismatch. A name may have been read incorrectly from a photo or scan
          (it does not look like a normal Korean name, or the text was unclear).
        action: >-
          Check the name on the original document yourself and ask to see the landlord's ID.
          If you uploaded a photo, correct the text in the text check step, or upload a clearer
          photo or the original PDF.

  ACCOUNT_HOLDER_MISMATCH:
    title: Account holder check
    evidence:
      left: Contract account holder
      right: Contract landlord
    results:
      STOP:
        explanation: >-
          The account holder ({accountHolder}) is not the landlord ({landlord}).
          Money sent to someone else's account may not count as paid to the landlord.
        action: Send money only to an account in the landlord's own name.
      CHECK.company_landlord:
        explanation: >-
          The landlord on this contract is a company, but the deposit account holder is a
          person. We did not compare the two names, because a person cannot be compared
          with a company. A deposit for a company normally goes to an account in the
          company's own name.
        action: >-
          This account is in a person's name, not the company's. Ask for an account in the
          company's own name, or ask the company for written proof that this person may
          receive the deposit for it.
      NO_FLAG:
        explanation: >-
          The account holder and the landlord appear to be the same person ({landlord}).
          This is based only on the documents you uploaded.
        action: No action needed for this check. Check the account holder again before you send money.
      UNVERIFIABLE:
        explanation: >-
          We could not confirm whether the account holder is the landlord, because the
          name or birth date could not be read or confirmed.
        action: >-
          Send money only to an account in the landlord's own name, and ask the landlord
          to confirm the account holder.
      UNVERIFIABLE.unreliable_name:
        explanation: >-
          The account holder and the landlord look like different people, but we did not
          treat this as a mismatch. A name may have been read incorrectly from a photo or scan
          (it does not look like a normal Korean name, or the text was unclear).
        action: >-
          Check the account holder's name on the original contract yourself. Send money only
          to an account in the landlord's own name, and ask the landlord to confirm the
          account holder.

  ADDRESS_MISMATCH:
    title: Property address check
    evidence:
      left: Registry address
      right: Contract address
    results:
      STOP:
        explanation: >-
          The address on the registry and the address on the contract look different.
          The registry may be for a different home, so the other checks may not apply
          to the home you are renting.
        action: Get a new registry for the exact address, including the unit number.
      NO_FLAG:
        explanation: The address on the registry and the address on the contract match.
        action: No action needed for this check. Always check the unit number yourself.
      CHECK.ocr_digits:
        explanation: >-
          The address on the registry and the address on the contract differ only in some
          numbers (for example the lot number or the unit number). At least one of the documents
          was read from a photo or scan, so a number may have been read incorrectly. We did not
          treat this as a different home.
        action: >-
          Compare the numbers on the original registry and contract yourself, including the lot
          number and the unit number. If they really differ, get a new registry for the exact address.
      CHECK.ocr_unreadable:
        explanation: >-
          The address on the registry and the address on the contract look different. At least one
          of the documents was read from a photo or scan, and the words in the address (city, district,
          building name) match, so the difference is in numbers or letters that may have been
          read incorrectly. We did not treat this as a different home.
        action: >-
          The photo may have been read incorrectly. Check the original contract and registry yourself,
          including the lot number and the unit number. If they really differ, get a new registry
          for the exact address.
      UNVERIFIABLE:
        explanation: We could not read the address on the registry or on the contract.
        action: Compare the address on the registry and the contract yourself, including the unit number.
      UNVERIFIABLE.region_unclear:
        explanation: >-
          We did not compare the two addresses because at least one of them does not start
          with a full city or province name (for example, Seoul Special City). The text may
          be shortened or may not have been read correctly.
        action: >-
          Compare the address on the registry and the contract yourself, including the city,
          the district, and the unit number.
      UNVERIFIABLE.format_differs:
        explanation: >-
          The two addresses look different, but they are written in different styles
          (a road-name address and a lot-number address), or the style could not be
          recognized. So we could not tell whether they are the same home.
        action: >-
          Check yourself that the registry and the contract are for the same home,
          including the unit number. If you are not sure, ask the agent.


  TRUST_REGISTERED:
    title: Trust (신탁)
    params:
      # 특약에 noticeWords 중 하나가 있고, 그 낱말 자리를 빼고도 "신탁"이 가까이(noticeWindowLines줄 안) 있으면 "신탁 안내가 있다"고 본다
      # 새 조항이 시작되는 줄(제N조, N., ①)에서는 줄 묶음을 끊는다
      # "동의", "계좌"처럼 흔한 낱말은 쓰지 않는다. (신탁을 말하는 낱말만)
      noticeWords: [수탁자, 신탁회사, 동의서]
      # 같은 줄 묶음에 excludeWords가 있으면 안내로 보지 않는다.
      # 말소 조건("잔금 전까지 신탁등기를 말소한다")과 부정 표현("신탁회사가 아닌 계좌", "동의는 받지 않았다", "동의 없이")은 STOP 유지
      excludeWords: [말소, 아닌, 아니, 않, 없이, 받지]
      noticeWindowLines: 2
    evidence:
      left: Registry trust entries
      right: Entries with unclear status
    results:
      STOP:
        explanation: >-
          The registry shows an active trust registration. In a trust, the trust company
          may be the real owner, and a lease signed without its consent may not be valid.
        action: >-
          Do not sign until you have the trust register (신탁원부) and written consent to
          the lease from the trustee.
      CHECK.trust_notice:
        explanation: >-
          The registry shows an active trust registration, and the special terms of this
          contract mention the trust. Some rental homes, such as company-run rental housing,
          use a trust on purpose. But a notice written in the contract does not prove that the
          trust company (the trustee) agreed to the lease.
        action: >-
          Before you sign, check four things. (1) In the trust register (신탁원부), who has the
          right to lease the home. (2) Whether the trustee has agreed to the lease in writing.
          (3) Whether the deposit goes to an account designated by the trust company.
          (4) Who will return the deposit at the end of the lease.
      CHECK.cancel_unknown:
        explanation: >-
          The registry shows a trust entry, but we could not tell whether it has been cancelled.
        action: >-
          Check the registry for a cancellation entry. If the trust is still active, ask for
          the trust register (신탁원부) and written consent from the trustee.
      NO_FLAG:
        explanation: >-
          No active trust registration was found on the registry.
          This is based only on the documents you uploaded.
        action: No action needed for this check. Use an up-to-date registry just before you sign.
      UNVERIFIABLE:
        explanation: We could not read the parts of the registry that show trust registrations.
        action: >-
          Check the registry for a trust entry yourself. If there is one, ask for the trust
          register (신탁원부) and written consent from the trustee.

  SEIZURE_ACTIVE:
    title: Seizure and provisional seizure (압류·가압류)
    evidence:
      left: Registry active entries
      right: Entries with unclear status
    results:
      STOP:
        explanation: >-
          The registry shows an active seizure or provisional seizure. It means a creditor or
          the government has a claim on this home. It can be sold at auction and your deposit
          may be at risk.
        action: Do not sign until you confirm in writing that the seizure has been cleared.
      CHECK.cancel_unknown:
        explanation: >-
          The registry shows a seizure or provisional seizure entry, but we could not tell
          whether it has been cancelled.
        action: >-
          Check the registry for a cancellation entry for it. Do not sign until you are sure
          it has been cleared.
      NO_FLAG:
        explanation: >-
          No active seizure or provisional seizure was found on the registry.
          This is based only on the documents you uploaded.
        action: No action needed for this check. Use an up-to-date registry just before you sign.
      UNVERIFIABLE:
        explanation: >-
          We could not read the parts of the registry that show seizures and provisional seizures.
        action: >-
          Check the registry for seizures (압류) and provisional seizures (가압류) yourself.
          Do not sign until you are sure there are none.

  PROVISIONAL_DISPOSITION_ACTIVE:
    title: Provisional disposition (가처분)
    evidence:
      left: Registry active entries
      right: Entries with unclear status
    results:
      STOP:
        explanation: >-
          The registry shows an active provisional disposition. It is a court order that can
          limit what the owner may do with this home, for example selling it or putting a new
          mortgage on it. If the court case ends against the owner, your lease and your
          deposit may be at risk.
        action: >-
          Do not sign until you confirm in writing that the provisional disposition has been
          cleared. Ask a lawyer or a legal aid service what it means for your lease.
      UNVERIFIABLE.cancel_unknown:
        explanation: >-
          The registry shows a provisional disposition entry, but we could not tell whether
          it has been cancelled.
        action: >-
          Check the registry for a cancellation entry for it. Do not sign until you are sure
          it has been cleared.
      UNVERIFIABLE.unread_rows:
        explanation: >-
          Some lines in the registry could not be read, and a provisional disposition could
          be hidden in them. We did not find one, but this is not a sign that there is none.
        action: >-
          Check the original registry for provisional dispositions (가처분) yourself,
          including any lines that could not be read. Do not sign until you are sure there
          are none.
      NO_FLAG:
        explanation: >-
          No active provisional disposition was found on the registry.
          This is based only on the documents you uploaded.
        action: No action needed for this check. Use an up-to-date registry just before you sign.
      UNVERIFIABLE:
        explanation: >-
          We could not read the parts of the registry that show provisional dispositions.
        action: >-
          Check the registry for provisional dispositions (가처분) yourself.
          Do not sign until you are sure there are none.

  AUCTION_ACTIVE:
    title: Auction started (경매개시결정)
    evidence:
      left: Registry active entries
      right: Entries with unclear status
    results:
      STOP:
        explanation: >-
          The registry shows an active auction start decision (경매개시결정). It means a court
          has started a forced sale of this home. The home may be sold to someone else, and
          your deposit may be at risk.
        action: >-
          Do not sign or send any money until you confirm in writing that the auction has been
          cancelled. Check the registry again just before you sign.
      UNVERIFIABLE.cancel_unknown:
        explanation: >-
          The registry shows an auction start decision entry, but we could not tell whether
          it has been cancelled.
        action: >-
          Check the registry for a cancellation entry for it. Do not sign or send any money
          until you are sure it has been cleared.
      UNVERIFIABLE.unread_rows:
        explanation: >-
          Some lines in the registry could not be read, and an auction start decision could
          be hidden in them. We did not find one, but this is not a sign that there is none.
        action: >-
          Check the original registry for an auction start decision (경매개시결정) yourself,
          including any lines that could not be read. Do not sign until you are sure there
          is none.
      NO_FLAG:
        explanation: >-
          No active auction start decision was found on the registry.
          This is based only on the documents you uploaded.
        action: No action needed for this check. Use an up-to-date registry just before you sign.
      UNVERIFIABLE:
        explanation: >-
          We could not read the parts of the registry that show auction start decisions.
        action: >-
          Check the registry for an auction start decision (경매개시결정) yourself.
          Do not sign until you are sure there is none.

  PROVISIONAL_REGISTRATION_ACTIVE:
    title: Provisional registration (가등기)
    evidence:
      left: Registry active entries
      right: Entries with unclear status
    results:
      CHECK:
        explanation: >-
          The registry shows an active provisional registration. It can reserve someone's right
          to take over ownership of this home later, for example after a sale promise. If that
          person completes the registration, the owner may change and your lease may be
          affected. It is not always a problem, but it needs to be checked.
        action: >-
          Check who holds the provisional registration and why. Ask the landlord to explain
          it and, if needed, to cancel it before you sign. Ask a lawyer or a legal aid
          service if you are not sure.
      UNVERIFIABLE.cancel_unknown:
        explanation: >-
          The registry shows a provisional registration entry, but we could not tell whether
          it has been cancelled.
        action: >-
          Check the registry for a cancellation entry for it. Do not sign until you are sure
          it has been cleared or explained.
      UNVERIFIABLE.unread_rows:
        explanation: >-
          Some lines in the registry could not be read, and a provisional registration could
          be hidden in them. We did not find one, but this is not a sign that there is none.
        action: >-
          Check the original registry for provisional registrations (가등기) yourself,
          including any lines that could not be read.
      NO_FLAG:
        explanation: >-
          No active provisional registration was found on the registry.
          This is based only on the documents you uploaded.
        action: No action needed for this check. Use an up-to-date registry just before you sign.
      UNVERIFIABLE:
        explanation: >-
          We could not read the parts of the registry that show provisional registrations.
        action: >-
          Check the registry for provisional registrations (가등기) yourself.
          Do not sign until you are sure there are none.    

  MORTGAGE_EXISTS:
    title: Mortgage (근저당)
    evidence:
      left: Maximum secured amount (채권최고액)
      right: Your deposit
    results:
      CHECK:
        explanation: >-
          A mortgage is registered on this home. Maximum secured amount: {maxClaim}.
          Your deposit: {deposit}. If the home is sold at auction, the mortgage is paid
          before your deposit.
        action: Compare the two amounts with the likely price of the home. Ask the agent to explain, and check it with an independent adviser too.
      CHECK.deposit_unknown:
        explanation: >-
          A mortgage is registered on this home (maximum secured amount: {maxClaim}).
          We could not read your deposit, so we did not compare the two amounts.
          If the home is sold at auction, the mortgage is paid before your deposit.
        action: >-
          Check the deposit on the contract, then compare it and the maximum secured amount
          with the likely price of the home.
      CHECK.amount_unknown:
        explanation: >-
          A mortgage is registered on this home, but we could not read the maximum secured
          amount, so we did not compare it with your deposit. If the home is sold at auction,
          the mortgage is paid before your deposit.
        action: >-
          Read the maximum secured amount (채권최고액) on the registry and compare it and your
          deposit with the likely price of the home.
      CHECK.cancel_unknown:
        explanation: >-
          The registry shows a mortgage entry, but we could not tell whether it has been cancelled.
        action: >-
          Check the registry for a cancellation entry. If the mortgage is still active, compare
          the maximum secured amount and your deposit with the likely price of the home.
      NO_FLAG:
        explanation: >-
          No active mortgage was found on the registry.
          This is based only on the documents you uploaded.
        action: No action needed for this check. Use an up-to-date registry just before you sign.
      UNVERIFIABLE:
        explanation: We could not read the parts of the registry that show mortgages.
        action: >-
          Check the registry for a mortgage (근저당) yourself and compare the maximum secured
          amount with your deposit.

  RECENT_OWNERSHIP_CHANGE:
    title: Recent ownership change
    params:
      withinMonths: 6
    evidence:
      left: Last transfer date on registry
      right: Contract date
    results:
      CHECK:
        explanation: >-
          The ownership of this home was transferred within {months} months before the
          contract date. A very recent sale can be a sign of a risky deal or a quick resale.
        action: Look at the date of the last ownership transfer. If it is recent, ask why the home was sold.
      CHECK.after_contract:
        explanation: >-
          The registry shows an ownership transfer dated after the contract date. The home
          may have been sold after the contract was made, or a date may have been read
          incorrectly.
        action: >-
          Compare the contract date and the date of the last ownership transfer, and ask
          who owns the home now.
      NO_FLAG:
        explanation: >-
          The last ownership transfer was more than {months} months before the contract date.
          This is based only on the documents you uploaded.
        action: No action needed for this check.
      UNVERIFIABLE:
        explanation: We could not read the date of the last ownership transfer or the contract date.
        action: >-
          Look at the date of the last ownership transfer on the registry. If it is recent,
          ask why the home was sold.

  RISKY_SPECIAL_TERM:
    title: Special terms check
    evidence:
      left: Special terms read
      right: Terms that matched
    results:
      STOP:
        explanation: >-
          A special term in this contract looks like it bans or limits address registration (전입신고)
          or the fixed date (확정일자). Without them your deposit may not be protected if the home is
          sold or goes to auction. Terms that matched: {matched}. {reasons}
        action: >-
          Ask the landlord or the agent to remove or change this term before you sign. Make sure you
          can register your address (전입신고) and get the fixed date (확정일자) as soon as you move in.
          If you are not sure what the term means, ask a legal aid service or another adviser you trust.
      CHECK:
        explanation: >-
          Some special terms in this contract match types of terms that are often unfavorable
          to tenants: {matched}. {reasons}
        action: >-
          Ask the landlord or the agent to explain or remove these terms before you sign.
          If you are not sure what they mean, ask a legal aid service or another adviser you trust.
      CHECK.ocr_registration_ban:
        explanation: >-
          A special term in this contract may ban or limit address registration (전입신고) or the
          fixed date (확정일자). But the contract was read from a photo or scan, so a word may have
          been read incorrectly (for example, "않는다" read as "앉는다"). We did not treat this as a
          confirmed ban. Terms that matched: {matched}. {reasons}
        action: >-
          Read the special terms on the original contract yourself. If a term really bans or limits
          address registration or the fixed date, ask the landlord or the agent to remove or change it
          before you sign. If you uploaded a photo, correct the text in the text check step, or upload
          a clearer photo or the original PDF.
      NO_FLAG:
        explanation: >-
          None of the special terms we could read matched our list of terms that are often
          unfavorable to tenants. This check only looks for certain keywords, so it does not
          mean the contract is safe.
        action: >-
          Read all special terms yourself, and ask the agent to explain anything you do not understand.
      NO_FLAG.no_terms:
        explanation: >-
          The special terms section of the contract is empty. This does not mean the contract
          is safe, because other parts of the contract can also be unfavorable.
        action: >-
          Read the whole contract yourself, and ask the agent to explain anything you do not understand.
      UNVERIFIABLE:
        explanation: >-
          We could not read the special terms (특약사항) section of the contract,
          so we could not check it.
        action: >-
          Read the special terms yourself. Look for terms about cash payment, address registration
          (전입신고), restoring or repairing the home, brokerage fees, and returning the deposit.
